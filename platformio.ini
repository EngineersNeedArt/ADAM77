; Adam77: a 40x24 serial terminal for KIM-1-era computers.
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 115200

; Teensy's USB type. "SERIAL" gives a USB debug console on the Teensy's own
; micro-USB port (separate from the USB *host* port used for the keyboard).
build_flags =
    -D USB_SERIAL
    -D TEENSY_OPT_FASTER

; ILI9341_t3 and USBHost_t36 ship with the Teensy framework, so no lib_deps are needed yet.
